<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="80" fill="#0d0d14"/>
  <!-- Paddle blade — rounded rectangle, tilted -30° -->
  <g transform="translate(236,270) rotate(-30)">
    <rect x="-90" y="-120" width="180" height="220" rx="90" fill="#7c7cf8"/>
    <!-- Handle -->
    <rect x="-28" y="100" width="56" height="110" rx="12" fill="#5555d6"/>
    <!-- Shine highlight on blade -->
    <ellipse cx="-20" cy="-55" rx="35" ry="50" fill="#a5a5fb" opacity="0.3"/>
  </g>
  <!-- Ping pong ball -->
  <circle cx="340" cy="150" r="70" fill="#ffffff"/>
  <!-- Ball seam -->
  <path d="M 286 125 Q 340 178 394 125" fill="none" stroke="#cccccc" stroke-width="3.5" stroke-linecap="round"/>
</svg>
